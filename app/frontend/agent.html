<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nexus // Coding Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #060a12;
    --panel: #0b1220;
    --panel-2: #0f1a2b;
    --line: #1c2b40;
    --cyan: #2fe0ff;
    --cyan-dim: #12586b;
    --violet: #8b7bff;
    --violet-dim: #3a3487;
    --text: #d7e3ee;
    --text-dim: #5c7690;
    --text-faint: #38495c;
    --ok: #35e0a0;
    --err: #ff5c72;
    --amber: #ffb454;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--void);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    background-image:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(47,224,255,0.06), transparent 60%),
      repeating-linear-gradient(180deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
  }

  .shell {
    max-width: 760px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 20px 20px 0;
  }

  .frame {
    position: relative;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: linear-gradient(180deg, var(--panel), var(--void) 40%);
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 80vh;
    overflow: hidden;
  }
  .frame::before, .frame::after,
  .frame .corner-br, .frame .corner-bl {
    content: '';
    position: absolute;
    width: 14px; height: 14px;
    border-color: var(--cyan);
    opacity: 0.7;
  }
  .frame::before { top: -1px; left: -1px; border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
  .frame::after { top: -1px; right: -1px; border-top: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }
  .corner-bl { bottom: -1px; left: -1px; border-bottom: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
  .corner-br { bottom: -1px; right: -1px; border-bottom: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    font-family: 'Chakra Petch', sans-serif;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    letter-spacing: 0.06em;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }
  .brand .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
  }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .status .pulse {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-faint);
    transition: background 0.2s, box-shadow 0.2s;
  }
  .status.busy .pulse {
    background: var(--amber);
    box-shadow: 0 0 6px var(--amber);
    animation: blink 1s infinite ease-in-out;
  }
  .status.ready .pulse { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .status.error .pulse { background: var(--err); box-shadow: 0 0 6px var(--err); }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .thread {
    flex: 1;
    overflow-y: auto;
    padding: 22px 22px 10px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .thread::-webkit-scrollbar { width: 8px; }
  .thread::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .empty {
    margin: auto;
    text-align: center;
    color: var(--text-faint);
    font-family: 'Chakra Petch', sans-serif;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .empty .big {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 6px;
    display: block;
  }

  .msg-user {
    align-self: flex-end;
    max-width: 78%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px 10px 2px 10px;
    padding: 10px 14px;
    font-size: 14.5px;
    line-height: 1.5;
  }

  .turn { display: flex; flex-direction: column; gap: 0; }

  .trace-node {
    position: relative;
    padding: 0 0 16px 26px;
    border-left: 1.5px solid var(--line);
    margin-left: 5px;
  }
  .trace-node:last-child { border-left-color: transparent; padding-bottom: 0; }
  .trace-node::before {
    content: '';
    position: absolute;
    left: -5.5px;
    top: 3px;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--void);
    border: 1.5px solid var(--text-faint);
  }
  .trace-node.thought::before { border-color: var(--violet); }
  .trace-node.action::before { border-color: var(--cyan); box-shadow: 0 0 6px var(--cyan-dim); }
  .trace-node.observation::before { border-color: var(--text-dim); }
  .trace-node.final::before { border-color: var(--ok); box-shadow: 0 0 6px var(--ok); background: var(--ok); }
  .trace-node.error::before { border-color: var(--err); background: var(--err); }

  .trace-label {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .trace-node.thought .trace-label { color: var(--violet); }
  .trace-node.action .trace-label { color: var(--cyan); }
  .trace-node.observation .trace-label { color: var(--text-dim); }
  .trace-node.final .trace-label { color: var(--ok); }
  .trace-node.error .trace-label { color: var(--err); }

  .trace-body {
    font-size: 14px;
    line-height: 1.55;
    color: var(--text);
  }
  .trace-node.thought .trace-body {
    color: var(--text-dim);
    font-style: italic;
  }
  .trace-node.action .trace-body {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--cyan);
  }
  .trace-node.observation .trace-body {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--text-dim);
    background: rgba(0,0,0,0.28);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 8px 10px;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 180px;
    overflow-y: auto;
  }
  .trace-node.final .trace-body { color: var(--ok); font-size: 14.5px; }
  .trace-node.error .trace-body { color: var(--err); }

  .thinking-line {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-faint);
    font-size: 12px;
    font-family: 'Chakra Petch', sans-serif;
    letter-spacing: 0.06em;
    padding-left: 26px;
  }
  .thinking-line .bar {
    width: 3px; height: 12px;
    background: var(--cyan);
    animation: rise 0.9s infinite ease-in-out;
  }
  .thinking-line .bar:nth-child(2) { animation-delay: 0.15s; }
  .thinking-line .bar:nth-child(3) { animation-delay: 0.3s; }
  @keyframes rise { 0%,100% { transform: scaleY(0.4); opacity: 0.5; } 50% { transform: scaleY(1); opacity: 1; } }

  .inputbar {
    display: flex;
    gap: 10px;
    padding: 16px 20px 20px;
    border-top: 1px solid var(--line);
  }
  .inputbar input {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .inputbar input:focus {
    border-color: var(--cyan-dim);
    box-shadow: 0 0 0 3px rgba(47,224,255,0.08);
  }
  .inputbar input::placeholder { color: var(--text-faint); }
  .inputbar button {
    background: var(--cyan);
    color: #04141a;
    border: none;
    border-radius: 6px;
    padding: 0 20px;
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  .inputbar button:hover { opacity: 0.88; }
  .inputbar button:active { transform: scale(0.97); }
  .inputbar button:disabled { opacity: 0.35; cursor: not-allowed; }

  .footnote {
    text-align: center;
    color: var(--text-faint);
    font-size: 10.5px;
    letter-spacing: 0.05em;
    padding: 10px 0 24px;
    font-family: 'Chakra Petch', sans-serif;
  }
</style>
</head>
<body>
<div class="shell">
  <div class="frame">
    <span class="corner-bl"></span><span class="corner-br"></span>
    <div class="topbar">
      <div class="brand"><span class="dot"></span> NEXUS // CODING AGENT</div>
      <div style="display:flex;align-items:center;gap:16px;">
        <a href="./index.html" style="color:var(--text-dim);text-decoration:none;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;font-family:'Chakra Petch',sans-serif;">&larr; Chat</a>
        <a href="./studio.html" style="color:var(--text-dim);text-decoration:none;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;font-family:'Chakra Petch',sans-serif;">Studio &rarr;</a>
        <div class="status" id="status"><span class="pulse"></span><span id="statusText">connecting</span></div>
      </div>
    </div>

    <div class="thread" id="thread">
      <div class="empty" id="emptyState">
        <span class="big">workspace idle</span>
        describe a coding task below to begin
      </div>
    </div>

    <div class="inputbar">
      <input id="taskInput" type="text" placeholder="e.g. write a script that reverses a string, then run it" autocomplete="off" />
      <button id="sendBtn">Run</button>
    </div>
  </div>
  <div class="footnote">tools: read_file &middot; write_file &middot; list_dir &middot; run_python &nbsp;/&nbsp; sandboxed to ./agent_workspace</div>
</div>

<script>
const API_BASE = window.location.origin;
const thread = document.getElementById('thread');
const emptyState = document.getElementById('emptyState');
const input = document.getElementById('taskInput');
const sendBtn = document.getElementById('sendBtn');
const statusEl = document.getElementById('status');
const statusText = document.getElementById('statusText');

function setStatus(mode, label) {
  statusEl.className = 'status ' + mode;
  statusText.textContent = label;
}

async function checkStatus() {
  try {
    const res = await fetch(API_BASE + '/api/v1/agent/status');
    const data = await res.json();
    if (data.ready) {
      setStatus('ready', 'ready \u00b7 ' + data.providers.join(', '));
    } else {
      setStatus('error', 'no provider configured');
    }
  } catch (e) {
    setStatus('error', 'backend unreachable');
  }
}
checkStatus();

function addUserMessage(text) {
  emptyState.remove();
  const el = document.createElement('div');
  el.className = 'msg-user';
  el.textContent = text;
  thread.appendChild(el);
  thread.scrollTop = thread.scrollHeight;
}

function newTurn() {
  const turn = document.createElement('div');
  turn.className = 'turn';
  thread.appendChild(turn);
  return turn;
}

function addTraceNode(turn, kind, label, body) {
  const node = document.createElement('div');
  node.className = 'trace-node ' + kind;
  const labelEl = document.createElement('div');
  labelEl.className = 'trace-label';
  labelEl.textContent = label;
  const bodyEl = document.createElement('div');
  bodyEl.className = 'trace-body';
  bodyEl.textContent = body;
  node.appendChild(labelEl);
  node.appendChild(bodyEl);
  turn.appendChild(node);
  thread.scrollTop = thread.scrollHeight;
}

function showThinking(turn) {
  const line = document.createElement('div');
  line.className = 'thinking-line';
  line.id = 'thinkingLine';
  line.innerHTML = '<span class="bar"></span><span class="bar"></span><span class="bar"></span> reasoning';
  turn.appendChild(line);
  thread.scrollTop = thread.scrollHeight;
  return line;
}

function removeThinking() {
  const el = document.getElementById('thinkingLine');
  if (el) el.remove();
}

async function runTask(task) {
  addUserMessage(task);
  const turn = newTurn();
  setStatus('busy', 'thinking');
  let thinkingLine = showThinking(turn);

  try {
    const res = await fetch(API_BASE + '/api/v1/agent/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ task })
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const event = JSON.parse(line);
        removeThinking();

        if (event.type === 'thought') {
          addTraceNode(turn, 'thought', 'thought', event.content);
        } else if (event.type === 'action') {
          addTraceNode(turn, 'action', 'action \u00b7 ' + event.tool, JSON.stringify(event.args));
        } else if (event.type === 'observation') {
          addTraceNode(turn, 'observation', 'observation', event.content);
        } else if (event.type === 'final') {
          addTraceNode(turn, 'final', 'done', event.content);
        } else if (event.type === 'error') {
          addTraceNode(turn, 'error', 'error', event.content);
        }
        thinkingLine = showThinking(turn);
      }
    }
    removeThinking();
    setStatus('ready', 'ready');
  } catch (e) {
    removeThinking();
    addTraceNode(turn, 'error', 'error', 'Could not reach agent: ' + e.message);
    setStatus('error', 'connection failed');
  }
}

function submit() {
  const task = input.value.trim();
  if (!task) return;
  input.value = '';
  sendBtn.disabled = true;
  runTask(task).finally(() => { sendBtn.disabled = false; });
}

sendBtn.addEventListener('click', submit);
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
</script>
</body>
</html>
